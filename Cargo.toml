[workspace]
members = ["xtask"]
resolver = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
as_conversions = "deny"

[package]
name = "mico"
version = "0.1.1"
edition = "2024"
description = "Mission control for local CLI AI agents"
license = "MIT"
repository = "https://github.com/thegeorgejoseph/mico"
keywords = ["cli", "tui", "git", "tmux", "macos"]
categories = ["command-line-utilities", "development-tools"]

[lints]
workspace = true

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
dirs = "6.0"
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.18", features = ["serde", "v4"] }
