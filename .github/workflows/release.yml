name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target aarch64-apple-darwin
      - name: Package release artifact
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARTIFACT="mico-${VERSION}-aarch64-apple-darwin"
          mkdir -p "dist/${ARTIFACT}"
          cp target/aarch64-apple-darwin/release/mico "dist/${ARTIFACT}/"
          cp README.md "dist/${ARTIFACT}/"
          tar -C dist -czf "dist/${ARTIFACT}.tar.gz" "${ARTIFACT}"
          shasum -a 256 "dist/${ARTIFACT}.tar.gz" > "dist/${ARTIFACT}.tar.gz.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
